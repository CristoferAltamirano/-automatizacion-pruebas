name: CI build and automated tests
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build unit tests integration tests and package
        shell: pwsh
        run: ./scripts/Invoke-CI.ps1
      - name: Preserve JAR test reports and execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.sha }}
          path: |
            target/*.jar
            target/surefire-reports/
            target/failsafe-reports/
            evidence/ci.log
